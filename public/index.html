<!DOCTYPE html>
<html>
<head>
    <title>Area Alerts</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: Arial; padding: 20px; }
        #map { height: 300px; margin-bottom: 20px; }
        .alert { border: 1px solid #ccc; padding: 10px; margin-bottom: 5px; }
        button { margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Area Alerts</h1>
    <div id="map"></div>
    <form id="alertForm">
        <input type="text" id="description" placeholder="Description" required>
        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">
        <button type="submit">Post Alert</button>
    </form>
    <h2>Latest Alerts</h2>
    <div id="alerts"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([5.6037, -0.1870], 13); // Default Accra
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker;
        map.on('click', function(e) {
            if (marker) map.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(map);
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;
        });

        document.getElementById('alertForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            if (!latitude || !longitude) {
                alert("Please select a location on the map.");
                return;
            }
            const alert = {
                description,
                coordinates: { lat: latitude, lng: longitude },
                timestamp: new Date().toISOString()
            };
            await fetch('/alerts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(alert)
            });
            loadAlerts();
            e.target.reset();
        });

        async function loadAlerts() {
            const res = await fetch('/alerts');
            const alerts = await res.json();
            const container = document.getElementById('alerts');
            container.innerHTML = '';
            alerts.forEach((alert, index) => {
                const div = document.createElement('div');
                div.className = 'alert';
                div.innerHTML = `
                    <strong>${alert.description}</strong><br>
                    📍 (${alert.coordinates.lat}, ${alert.coordinates.lng})<br>
                    🕒 ${new Date(alert.timestamp).toLocaleString()}
                    <button onclick="deleteAlert(${index})">Delete</button>
                `;
                container.appendChild(div);
            });
        }

        async function deleteAlert(index) {
            await fetch(`/alerts/${index}`, { method: 'DELETE' });
            loadAlerts();
        }

        loadAlerts();
    </script>
</body>
</html>
