<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Alert - Community Alert System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
    <header>
        <h1>Report an Alert</h1>
        <p>Help keep your community informed</p>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <form id="alert-form">
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="traffic">Traffic</option>
                            <option value="building">Building Demolition</option>
                            <option value="event">Ongoing Event</option>
                            <option value="weather">Weather Alert</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" required placeholder="Brief description of the alert">
                    </div>

                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" required placeholder="Provide more details about the alert"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Location:</label>
                        <div id="map" style="height: 300px; margin-bottom: 10px;"></div>
                        <button type="button" id="get-location" class="btn-secondary">Use My Current Location</button>
                        <p id="location-status">Click on the map to set the alert location</p>
                    </div>

                    <input type="hidden" id="lat">
                    <input type="hidden" id="lng">
                    <input type="hidden" id="userId" value="user-${Date.now()}">

                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Submit Alert</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
